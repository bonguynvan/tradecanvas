    <rect x="8" y="205" width="24" height="60" rx="2" fill="#f0616d"/>
    <rect x="58" y="190" width="24" height="60" rx="2" fill="#3ccf91"/>
    <rect x="108" y="140" width="24" height="70" rx="2" fill="#3ccf91"/>
    <rect x="158" y="150" width="24" height="45" rx="2" fill="#f0616d"/>
    <rect x="208" y="100" width="24" height="70" rx="2" fill="#3ccf91"/>
    <rect x="258" y="60" width="24" height="70" rx="2" fill="#3ccf91"/>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeCanvas live desk</title>
<script type="importmap">
{
  "imports": {
    "@tradecanvas/commons": "/packages/commons/dist/index.js",
    "@tradecanvas/core": "/packages/core/dist/index.js",
    "@tradecanvas/chart": "/packages/library/dist/index.js",
    "@tradecanvas/chart/widget": "/packages/library/dist/widget/index.js"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
  #host { position: absolute; inset: 0; }
  #hud {
    position: absolute; z-index: 10; left: 50%; top: 52px; transform: translateX(-50%);
    display: flex; gap: 22px; padding: 8px 16px; border-radius: 6px;
    background: rgba(8, 10, 14, 0.82); border: 1px solid rgba(255, 255, 255, 0.12);
    font: 500 12px/1.3 ui-monospace, 'JetBrains Mono', Consolas, monospace; color: #9aa4b2;
    pointer-events: none; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #hud b { display: block; font-size: 17px; font-weight: 600; color: #e8edf3; }
  #hud[hidden] { display: none; }
</style>
</head>
<body>
<div id="host"></div>
<div id="hud" hidden></div>
<script type="module" src="./desk.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeCanvas finance charts audit</title>
<script type="importmap">
{
  "imports": {
    "@tradecanvas/commons": "/packages/commons/dist/index.js",
    "@tradecanvas/core": "/packages/core/dist/index.js",
    "@tradecanvas/chart": "/packages/library/dist/index.js"
  }
}
</script>
<style>
  html, body { margin: 0; font: 12px sans-serif; }
  body.dark { background: #2b2d31; color: #ddd; }
  body.light { background: #d9d9d6; color: #222; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; padding: 8px; }
  .cell b { display: block; padding: 2px 4px; }
  .box { height: 240px; }
  .box.small { height: 56px; }
  #dashboard { margin: 8px; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="dashboard"></div>
<script type="module">
// Every finance chart once with ordinary data, then the states that broke
// before: a step of zero, long labels, values all the same, one level of a
// book, colours in every form, cells with no number, and nothing to show.
import * as lib from '@tradecanvas/chart';

const query = new URLSearchParams(location.search);
const theme = query.get('theme') === 'light' ? 'light' : 'dark';
const locale = query.get('locale') ?? undefined;
document.body.className = theme;
const stage = (window.stage = { ready: false, errors: [], charts: {} });
window.addEventListener('error', (e) => stage.errors.push(e.message));

const grid = document.getElementById('grid');
function cell(name, make, small) {
  const wrap = document.createElement('div');
  wrap.className = 'cell';
  const title = document.createElement('b');
  title.textContent = name;
  const box = document.createElement('div');
  box.className = small ? 'box small' : 'box';
  box.id = name;
  wrap.append(title, box);
  grid.appendChild(wrap);
  try {
    stage.charts[name] = make(box);
  } catch (e) {
    stage.errors.push(`${name}: ${e.message}`);
  }
}

/** The same numbers on every run. */
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const random = seeded(11);
const DAY = 86_400_000;
const start = Date.UTC(2026, 0, 1);
const base = { theme, locale };

const curve = Array.from({ length: 120 }, (_, i) => ({ time: start + i * DAY, value: 100_000 + Math.sin(i / 9) * 9_000 + i * 320 }));
const benchmark = Array.from({ length: 9 }, (_, i) => ({ time: start + (i * 20 - 20) * DAY, value: 98_000 + i * 2_600 }));
const book = {
  bids: Array.from({ length: 14 }, (_, i) => ({ price: 100 - i * 0.5, volume: 5 + i * 1.5 })),
  asks: Array.from({ length: 14 }, (_, i) => ({ price: 100.5 + i * 0.5, volume: 4 + i * 1.8 })),
};
const bars = [];
let price = 100;
for (let i = 0; i < 260; i++) {
  const open = price;
  price = open * (1 + (random() - 0.48) * 0.03);
  bars.push({ time: start + i * DAY, open, high: Math.max(open, price) * 1.01, low: Math.min(open, price) * 0.99, close: price, volume: 800 + random() * 900 + Math.sin(i / 14) * 500 });
}
const days = Array.from({ length: 150 }, (_, i) => ({ date: new Date(start + i * DAY).toISOString().slice(0, 10), value: (random() - 0.5) * 4 }));
const returns = Array.from({ length: 5 }, () => Array.from({ length: 60 }, () => random() - 0.5));
const sectors = [['Banks', ['VCB', 'BID', 'CTG', 'TCB', 'MBB']], ['Steel', ['HPG', 'HSG', 'NKG']], ['Property', ['VHM', 'VIC', 'NVL', 'KDH']], ['Retail', ['MWG', 'PNJ']]];
const market = sectors.flatMap(([group, names]) => names.map((label) => ({ id: label, label, group, value: (random() - 0.5) * 9, weight: 60 + random() * 400 })));

cell('bar', (el) => new lib.BarChart(el, { ...base, categories: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], series: [{ name: 'Foreign', values: [120, -80, 45, -30, 95] }, { name: 'Proprietary', values: [-40, 60, 15, 70, -25] }], showValues: true }));
cell('donut', (el) => new lib.DonutChart(el, { ...base, data: [{ label: 'Stocks', value: 52 }, { label: 'Bonds', value: 23 }, { label: 'Cash', value: 18 }, { label: 'Gold', value: 7 }], centerLabel: 'Total', centerValue: '1.2B' }));
cell('scatter', (el) => new lib.ScatterChart(el, { ...base, series: [{ name: 'Holdings', points: Array.from({ length: 24 }, (_, i) => ({ x: 6 + random() * 30, y: -8 + random() * 30, size: 5 + random() * 40, label: `S${i}` })) }], xLabel: 'Volatility %', yLabel: 'Return %' }));
cell('histogram', (el) => new lib.HistogramChart(el, { ...base, values: Array.from({ length: 400 }, () => (random() + random() + random() - 1.5) * 3), colorBySign: true, markers: [{ value: 0.2, label: 'Mean' }] }));
cell('calendar', (el) => new lib.CalendarChart(el, { ...base, data: days, weekdays: 5 }));
cell('matrix', (el) => new lib.MatrixChart(el, { ...base, rows: ['VCB', 'BID', 'HPG', 'VHM', 'MWG'], values: lib.correlationMatrix(returns), colorScale: { min: -1, max: 1 } }));
cell('counter-clock', (el) => new lib.CounterClockChart(el, { ...base, data: bars, period: 25, points: 120 }));
cell('heatmap-sectors', (el) => new lib.HeatmapChart(el, { ...base, data: market, grouped: true }));
cell('equity', (el) => new lib.EquityCurveChart(el, { ...base, data: curve, benchmark, benchmarkLabel: 'Index', drawdown: true, fillArea: true }));
cell('depth', (el) => new lib.DepthChart(el, { ...base, data: book }));
cell('waterfall', (el) => new lib.WaterfallChart(el, { ...base, data: [{ label: 'Revenue', value: 120 }, { label: 'Costs', value: -45 }, { label: 'Tax', value: -15 }, { label: 'Net', value: 60, type: 'total' }] }));
cell('gauge', (el) => new lib.GaugeChart(el, { ...base, value: 62, animate: false, zones: [{ from: 0, to: 40, color: '#1fa874' }, { from: 40, to: 70, color: '#e0a030' }, { from: 70, to: 100, color: '#e8505b' }] }));
cell('sparkline', (el) => new lib.SparklineChart(el, { ...base, data: [3, 5, 4, 8, 6, 9, 7], showLastPoint: true }), true);

cell('waterfall-zero-long-labels', (el) => new lib.WaterfallChart(el, { ...base, data: [{ label: 'Revenue from operations', value: 120 }, { label: 'Nothing this quarter', value: 0 }, { label: 'Costs of the period', value: -45 }, { label: 'Not a number', value: NaN }, { label: 'Tax', value: -15 }, { label: 'Net', value: 60, type: 'total' }] }));
cell('equity-flat', (el) => new lib.EquityCurveChart(el, { ...base, data: [{ time: start, value: 50 }, { time: start + 30 * DAY, value: 50 }] }));
cell('depth-one-level', (el) => new lib.DepthChart(el, { ...base, data: { bids: [{ price: 100, volume: 5 }], asks: [] } }));
cell('depth-small-prices', (el) => new lib.DepthChart(el, { ...base, bidColor: 'rgb(31, 168, 116)', askColor: '#e55', data: { bids: [{ price: 0.00001234, volume: 5e6 }, { price: 0.00001232, volume: 9e6 }], asks: [{ price: 0.00001236, volume: 4e6 }, { price: 0.00001239, volume: 7e6 }] } }));
cell('heatmap-no-numbers', (el) => new lib.HeatmapChart(el, { ...base, weighted: true, data: [{ id: 'a', label: 'AAA', value: 3, weight: 5 }, { id: 'b', label: 'No value', value: NaN, weight: 3 }, { id: 'c', label: 'No weight', value: -2, weight: NaN }, { id: 'd', label: 'DDD', value: -4, weight: 2 }] }));
cell('sparkline-short-hex', (el) => new lib.SparklineChart(el, { ...base, data: [3, 5, 4, 8, 6, 9, 7], color: '#0af' }), true);
cell('empty-waterfall', (el) => new lib.WaterfallChart(el, { ...base, data: [] }));
cell('empty-equity', (el) => new lib.EquityCurveChart(el, { ...base, data: [] }));
cell('empty-depth', (el) => new lib.DepthChart(el, { ...base, data: { bids: [], asks: [] } }));

let equity = 100_000;
const samples = Array.from({ length: 400 }, (_, i) => {
  equity *= 1 + Math.sin(i / 23) * 0.004 + 0.0006;
  return { time: start + i * DAY, equity };
});
try {
  stage.dashboard = new lib.PerformanceDashboard(document.getElementById('dashboard'), {
    ...base,
    title: 'Strategy',
    result: { equityCurve: samples, metrics: { totalReturnPct: 0.31, cagr: 0.27, sharpe: 1.4, sortino: 2.1, maxDrawdownPct: 0.08, winRate: 0.56, profitFactor: 1.7, trades: 120 } },
  });
} catch (e) {
  stage.errors.push(`dashboard: ${e.message}`);
}

requestAnimationFrame(() => requestAnimationFrame(() => {
  stage.ready = true;
}));
</script>
</body>
</html>

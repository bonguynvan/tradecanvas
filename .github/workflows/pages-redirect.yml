# The demo site moved from GitHub Pages to tradecanvas.dev. Pages now serves
# a page per old address that sends readers on (scripts/redirects.mjs), and
# the llms files where agents already fetch them.
name: Pages redirect
on:
  push:
    branches: [main]
    paths:
      - 'scripts/redirects.mjs'
      - 'demo/static/llms*.txt'
      - 'demo/src/lib/docs/en/**'
      - 'demo/src/lib/i18n/languages.ts'
      - '.github/workflows/pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node --test scripts/redirects.test.mjs
      - run: node scripts/redirects.mjs _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

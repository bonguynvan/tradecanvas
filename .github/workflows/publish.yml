name: Publish
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.changeset/**'
  # By hand, to finish a release that stopped part way: it versions the
  # changesets waiting, publishes every version not on npm, and tags and
  # releases every one without its tag or release.
  workflow_dispatch:

# A release publishes package by package; a push in the middle waits for it
# instead of stopping it with half the packages out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # With changesets waiting, sets their versions, dates the root changelog and
  # commits that to main: merging a pull request with a changeset is the
  # release, and there is no version pull request. It cannot publish. Its
  # commit starts no run of its own (a push by this token never does): the
  # jobs below go on from it, at the commit it gives them.
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # Main as it is now, not as it was at this run's push: a run that waited
      # behind another finds the versions that one set.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: node scripts/release-version.mjs

  # Builds and packs every version not on npm. Installing and building run the
  # dependencies' own code, so this job holds no right to publish or push.
  pack:
    needs: version
    # A run by hand from another branch would publish, tag and release from it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      work: ${{ steps.check.outputs.work }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      # Most pushes release nothing: then the install, the build and the
      # publishing job are skipped. It needs only Node, npm, git and gh.
      - id: check
        run: node scripts/publish-packages.mjs --check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.work == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.work == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.work == 'true'
      - run: pnpm build
        if: steps.check.outputs.work == 'true'
      - run: node scripts/publish-packages.mjs --pack-to "$RUNNER_TEMP/packed"
        if: steps.check.outputs.work == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.work == 'true'
        with:
          name: packed
          path: ${{ runner.temp }}/packed
          retention-days: 1

  # Publishes the packed tarballs one at a time, each after the ones it pins
  # and once they are live, then tags and releases each version. It installs
  # nothing from the workspace. It runs after any push to main with work to
  # do, not only one that brought a changeset, so a release whose run was
  # skipped goes out with the next one.
  publish:
    needs: [version, pack]
    if: needs.pack.outputs.work == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: npm swaps this job's OIDC token for a one-time
      # token, so no npm token is stored here, and it records provenance (which
      # workflow run built each version) on its own.
      id-token: write
    steps:
      # The whole history: a tag goes on the commit that set its version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@v4
        with:
          name: packed
          path: ${{ runner.temp }}/packed
      - run: node scripts/publish-packages.mjs --publish-from "$RUNNER_TEMP/packed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

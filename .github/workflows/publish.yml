name: Publish
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.changeset/**'

# A release publishes package by package; a push in the middle waits for it
# instead of stopping it with half the packages out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: npm swaps this job's OIDC token for a one-time
      # publish token, so no npm token is stored here, and it records provenance
      # (which workflow run built each version) on its own.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@11.11.0

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

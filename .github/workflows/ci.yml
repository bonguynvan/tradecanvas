name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Generated docs (indicator catalog, llms.txt) are current; agent-skill examples type-check.
      - run: pnpm docs:check
      # The pages that send the old GitHub Pages addresses to tradecanvas.dev, and the eval harness.
      - run: pnpm test:scripts
      # Each eval task's reference answer passes its grader, and its wrong answers fail it (no agent runs here).
      - run: pnpm eval:check
      # The site: types (every language's strings match the English shape) and its i18n tests.
      - run: pnpm --filter @tradecanvas/demo check
      - run: pnpm --filter @tradecanvas/demo test

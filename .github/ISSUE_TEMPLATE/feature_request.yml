name: Feature request
description: An indicator, drawing tool, option or API you'd like to see.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or the use case, not only the solution. "My bot posts signals and I want them on the chart" says more than "add markers".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, an API sketch if you have one, and how you get by today.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chart types
        - Indicators
        - Drawing tools
        - Trading
        - Data adapters and streaming
        - Widget UI
        - Framework wrappers
        - Backtesting and analytics
        - Docs and examples
        - Something else
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this.
